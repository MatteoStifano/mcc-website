<!DOCTYPE html>
<html lang="it" data-lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-it="MCC - Monopoli Coders Club" data-en="MCC - Monopoli Coders Club">MCC - Monopoli Coders Club</title>
  <link rel="icon" href="mcc_logo.jpeg" type="image/jpeg">
  <style>
    :root {
      --accent: #4a9fd8;
      --accent-dark: #2f7fb8;
      --text-primary: #1f2933;
      --text-secondary: #52606d;
      --bg: #f7fafc;
      --card-bg: #ffffff;
      --border: #e4e9ef;
      color-scheme: light;
    }

    html[data-theme="dark"] {
      --accent: #4a9fd8;
      --accent-dark: #61aee6;
      --text-primary: #e5eaf0;
      --text-secondary: #a3b0bd;
      --bg: #0f1419;
      --card-bg: #1a2129;
      --border: #2c3744;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-primary);
      padding: 24px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    main {
      width: 100%;
      max-width: 560px;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 32px;
      box-shadow: 0 10px 30px rgba(31, 41, 51, 0.06);
      position: relative;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .lang-switch {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 0.85rem;
    }

    .lang-switch button {
      background: none;
      border: none;
      font: inherit;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0;
      border-bottom: 1px solid transparent;
    }

    .lang-switch button:hover {
      color: var(--accent-dark);
      border-bottom-color: var(--accent-dark);
    }

    .lang-switch button[aria-current="true"] {
      color: var(--accent-dark);
      font-weight: 600;
    }

    .lang-switch .theme-toggle {
      border-bottom: none;
      font-size: 1rem;
      line-height: 1;
      vertical-align: middle;
    }

    .lang-switch .sep {
      color: var(--border);
      margin: 0 6px;
    }

    .site-nav {
      margin: 8px 0 16px;
      font-size: 0.95rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      column-gap: 10px;
      row-gap: 8px;
    }

    .site-nav a {
      color: var(--accent-dark);
      text-decoration: none;
      font-weight: 600;
      padding: 4px 2px;
    }

    .site-nav a:hover {
      text-decoration: underline;
    }

    img {
      max-width: 260px;
      width: 78%;
      height: auto;
      margin-bottom: 8px;
    }

    .tagline {
      color: #61aee6;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.2px;
      margin: 8px 0 24px;
    }

    .about {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
      margin: 0 auto;
      max-width: 440px;
    }

    footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    [data-i18n] {
      display: none;
    }

    html[data-lang="it"] [data-i18n="it"],
    html[data-lang="en"] [data-i18n="en"] {
      display: block;
    }

    html[data-lang="it"] .site-nav [data-i18n="it"],
    html[data-lang="en"] .site-nav [data-i18n="en"] {
      display: inline;
    }

    @media (max-width: 480px) {
      main {
        padding: 32px 20px;
      }

      .lang-switch {
        position: static;
        display: block;
        margin-bottom: 16px;
        text-align: right;
      }

      .site-nav {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }

      .site-nav .sep {
        display: none;
      }

      .site-nav a {
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .tagline {
        font-size: 1rem;
      }

      .about {
        font-size: 0.95rem;
      }
    }
  </style>
  <script>
    (function () {
      var theme = localStorage.getItem("mcc-theme");
      if (theme !== "dark" && theme !== "light") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <main>
    <nav class="lang-switch" aria-label="Language selector">
      <button type="button" data-set-lang="it" aria-current="true">IT</button>
      <span class="sep">|</span>
      <button type="button" data-set-lang="en">EN</button>
      <span class="sep">|</span>
      <button type="button" class="theme-toggle" data-toggle-theme aria-label="Toggle dark mode">🌙</button>
    </nav>

    <img src="mcc_logo.jpeg" alt="MCC - Monopoli Coders Club logo">

    <nav class="site-nav" aria-label="Site navigation">
      <a href="chi-siamo.html" data-i18n="it">Chi siamo</a>
      <a href="chi-siamo.html" data-i18n="en">About us</a>
      <span class="sep">|</span>
      <a href="workshops.html">Workshops</a>
      <span class="sep">|</span>
      <a href="progetti.html" data-i18n="it">Progetti</a>
      <a href="progetti.html" data-i18n="en">Projects</a>
      <span class="sep">|</span>
      <a href="contatti.html" data-i18n="it">Contatti</a>
      <a href="contatti.html" data-i18n="en">Contacts</a>
    </nav>

    <footer>&copy; <span id="year"></span> Monopoli Coders Club</footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const root = document.documentElement;
    const buttons = document.querySelectorAll("[data-set-lang]");

    function setLang(lang) {
      root.setAttribute("data-lang", lang);
      root.setAttribute("lang", lang);
      buttons.forEach((btn) => {
        btn.setAttribute("aria-current", String(btn.dataset.setLang === lang));
      });
      localStorage.setItem("mcc-lang", lang);
    }

    buttons.forEach((btn) => {
      btn.addEventListener("click", () => setLang(btn.dataset.setLang));
    });

    const saved = localStorage.getItem("mcc-lang");
    if (saved === "it" || saved === "en") {
      setLang(saved);
    }

    const themeBtn = document.querySelector("[data-toggle-theme]");

    function applyTheme(theme) {
      root.setAttribute("data-theme", theme);
      themeBtn.textContent = theme === "dark" ? "☀️" : "🌙";
      localStorage.setItem("mcc-theme", theme);
    }

    themeBtn.textContent = root.getAttribute("data-theme") === "dark" ? "☀️" : "🌙";

    themeBtn.addEventListener("click", () => {
      applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });
  </script>
</body>
</html>
