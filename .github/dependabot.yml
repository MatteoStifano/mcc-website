# Weekly dependency update PRs. Each one is built by the deploy workflow,
# so a broken update shows up as a failing check before anyone merges it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Astro and its integrations are released together; update them in one PR
      astro:
        patterns:
          - astro
          - "@astrojs/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
